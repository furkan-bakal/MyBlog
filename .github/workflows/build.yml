name: build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/furkan-bakal/myblog-api:latest
            ghcr.io/furkan-bakal/myblog-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # GHCR paket sayfasında kafa karıştıran "unknown/unknown" platform
          # girdisi oluşmasın (buildx attestation manifest'i eklemesin).
          provenance: false
